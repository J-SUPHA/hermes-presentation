<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Hermes Promo Code</title>
<style>
  :root { --bg:#0b0e14; --card:#131826; --border:#232b3d; --fg:#e6e9f0; --muted:#8b93a7; --accent:#7c5cff; --accent2:#22d3a7; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--border);
          border-radius:20px; padding:36px 26px; text-align:center; }
  .icon { font-size:2.4rem; }
  h1 { font-size:1.4rem; margin:12px 0 18px; }
  .code-box { display:flex; gap:10px; align-items:center; justify-content:center; background:var(--bg);
              border:1px dashed var(--accent2); border-radius:14px; padding:20px; margin-bottom:16px; }
  .code-box code { font-size:1.35rem; font-weight:800; letter-spacing:.08em; color:var(--accent2); }
  .copy-btn { padding:10px 16px; border-radius:10px; border:1px solid var(--accent2); background:transparent;
              color:var(--accent2); font-weight:700; font-size:.82rem; cursor:pointer; white-space:nowrap; }
  p.how { color:var(--muted); font-size:.85rem; line-height:1.7; }
  p.how a { color:var(--accent2); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎁</div>
  <h1>Your promo code</h1>

  <!-- ═══════════════════════════════════════════════════════════
       SET YOUR PROMO CODE HERE — change only the text between the
       <code> tags. E.g. <code id="promo-code">HERMES-FREE-25</code>
       ═══════════════════════════════════════════════════════════ -->
  <div class="code-box">
    <code id="promo-code">PROMO-CODE-TBD</code>
    <button class="copy-btn" id="copy-btn" type="button">Copy</button>
  </div>

  <p class="how">Redeem it in <a href="https://portal.nousresearch.com/">Nous Portal</a> → billing / credits.<br>
  Then in Hermes: <b>hermes setup --portal</b></p>
</div>
<script>
document.getElementById('copy-btn').addEventListener('click', async (e) => {
  const code = document.getElementById('promo-code').textContent.trim();
  try {
    await navigator.clipboard.writeText(code);
    e.target.textContent = 'Copied ✓';
  } catch { e.target.textContent = code; }
});
</script>
</body>
</html>
